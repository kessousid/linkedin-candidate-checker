<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Curatal Candidates</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 14px;
    color: #1a1a1a;
    max-width: 900px;
    margin: 32px auto;
    padding: 0 16px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 13px; vertical-align: top; }
  th { color: #555; font-weight: 600; border-bottom: 2px solid #ddd; }
  tr:hover { background: #fafafa; }
  a { color: #1b4b8c; }
  #status { color: #666; margin: 12px 0; }
  #status.error { color: #b3261e; }
  button {
    padding: 6px 12px;
    border: none;
    border-radius: 4px;
    background: #1b4b8c;
    color: white;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <h1>Curatal Candidates</h1>
  <div class="sub">Everyone the LinkedIn extension has checked in as not-a-duplicate and added.</div>
  <button id="refreshBtn">Refresh</button>
  <div id="status"></div>
  <table id="table" style="display:none">
    <thead>
      <tr><th>Name</th><th>Title</th><th>Company</th><th>Location</th><th>LinkedIn</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script src="browse.js"></script>
</body>
</html>
