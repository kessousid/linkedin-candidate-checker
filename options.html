<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Curatal Candidate Checker — Settings</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 14px;
    max-width: 480px;
    margin: 40px auto;
    color: #1a1a1a;
  }
  h1 { font-size: 18px; }
  label { display: block; margin-top: 14px; font-size: 12px; color: #555; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    font-size: 14px;
    margin-top: 4px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  button {
    margin-top: 18px;
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    background: #1b4b8c;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  #status { margin-top: 12px; font-size: 13px; }
</style>
</head>
<body>
  <h1>Curatal Candidate Checker — Settings</h1>
  <p>Connects to the real Curatal <strong>Dev</strong> environment only (<code>curatal-dev.openturf.dev</code>) — never staging or production. Log in with your Curatal Dev recruiter account.</p>

  <label>Recruiter email
    <input type="email" id="email" placeholder="you@curatal.com" />
  </label>
  <label>Password
    <input type="password" id="password" />
  </label>

  <button id="saveBtn">Log in</button>
  <div id="status"></div>
  <div id="loggedInAs" style="display:none; margin-top:14px; font-size:13px; color:#1e7a34;"></div>

  <script src="options.js"></script>
</body>
</html>
