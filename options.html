<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Curatal Candidate Checker — Settings</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 14px;
    max-width: 480px;
    margin: 40px auto;
    color: #1a1a1a;
  }
  h1 { font-size: 18px; }
  label { display: block; margin-top: 14px; font-size: 12px; color: #555; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    font-size: 14px;
    margin-top: 4px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  button {
    margin-top: 18px;
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    background: #1b4b8c;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { background: #a9b7c9; cursor: default; }
  button.secondary { background: #eef1f6; color: #1b4b8c; }
  #status { margin-top: 12px; font-size: 13px; }
  .status.error { color: #b3261e; }
  .status.ok { color: #1e7a34; }
</style>
</head>
<body>
  <h1>Curatal Candidate Checker — Settings</h1>
  <p>Connects to the Curatal staging environment (staging.curatal.com) — that host isn't configurable here. Log in with a Platform Admin account: this is required for the bulk LinkedIn backfill to save a match onto a candidate's profile, not just find it.</p>

  <div id="loggedInView" style="display:none">
    <div id="loggedInAs" style="font-size:13px; color:#1e7a34;"></div>
    <button id="logoutBtn" class="secondary">Log out</button>
  </div>

  <form id="loginForm">
    <label>Platform Admin email
      <input type="text" id="email" autocomplete="username" />
    </label>
    <label>Password
      <input type="password" id="password" autocomplete="current-password" />
    </label>
    <button id="loginBtn" type="submit">Log in</button>
  </form>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
